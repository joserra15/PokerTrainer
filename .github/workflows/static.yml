# Tests on push/PR to main. GitHub Pages publica desde la rama main (legacy).
# No usar actions/deploy-pages aquí: compite con pages-build-deployment
# y acaba en timeout (deployment_queued / Page build failed).
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages-tests"
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: CI regression suite (test:ci)
        run: npm run test:ci
