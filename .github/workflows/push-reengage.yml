# Push re-engage (inactivos 7 días) + limpieza de suscripciones
name: Push re-engage

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Call push-dispatch-reengage
        env:
          URL: ${{ secrets.SUPABASE_FUNCTIONS_URL }}
          SECRET: ${{ secrets.PUSH_CRON_SECRET }}
        run: |
          if [ -z "$URL" ] || [ -z "$SECRET" ]; then
            echo "Sin SUPABASE_FUNCTIONS_URL o PUSH_CRON_SECRET — job informativo OK"
            exit 0
          fi
          curl -fsS -X POST "${URL%/}/push-dispatch-reengage" \
            -H "x-cron-secret: ${SECRET}" \
            -H "Content-Type: application/json" \
            -d '{"cleanup":true}'
