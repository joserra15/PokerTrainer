name: E2E Playwright

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      full:
        description: 'Run full suite (not only @smoke)'
        required: false
        default: 'false'

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps
      - name: Build JS bundles
        run: npm run build
      - name: Run E2E smoke (PR) or full (main)
        env:
          # PR → smoke rápido; push main / dispatch full → suite completa
          SMOKE: ${{ github.event_name == 'pull_request' && inputs.full != 'true' && '1' || '' }}
        run: npx playwright test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
