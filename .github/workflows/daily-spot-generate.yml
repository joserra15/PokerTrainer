# Spot del día — pre-generación (hoy + mañana)
name: Daily spot generate

on:
  schedule:
    # 00:05 Europe/Madrid ≈ 22:05 UTC (CET) / 23:05 UTC (CEST) — usamos 22:10 UTC
    - cron: '10 22 * * *'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Call daily-spot-generate
        env:
          URL: ${{ secrets.SUPABASE_FUNCTIONS_URL }}
          SECRET: ${{ secrets.PUSH_CRON_SECRET }}
        run: |
          if [ -z "$URL" ] || [ -z "$SECRET" ]; then
            echo "Sin SUPABASE_FUNCTIONS_URL o PUSH_CRON_SECRET — job informativo OK"
            exit 0
          fi
          curl -fsS -X POST "${URL%/}/daily-spot-generate" \
            -H "x-cron-secret: ${SECRET}" \
            -H "Content-Type: application/json" \
            -d '{}'
